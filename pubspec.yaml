name: ncm_api_enhanced
description: >
  Unofficial Netease Cloud Music API for Flutter, backed by an embedded
  Node.js 26.12.1 runtime. Exposes all 439 upstream module functions as
  a Dart facade; runs on Linux/macOS (via the system `node` binary),
  Windows (via node.exe fetched by the build hook and bundled next to
  the app executable), Android (arm64-v8a only, via libnode.so loaded
  by the native bridge), and iOS (via NodeMobile.xcframework embedded in
  the .app bundle).
version: 0.3.0
homepage: https://github.com/cmachsocket/ncm_api_enhanced
repository: https://github.com/cmachsocket/ncm_api_enhanced

environment:
  sdk: ^3.10.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # Packages used in hook/build.dart. The Dart SDK treats anything
  # imported from hook/ as a runtime dependency, not a dev dependency,
  # even though the hook only runs at build time. These are not
  # shipped in the consumer's app binary — they're only resolved by
  # the host that runs `flutter pub get` / `dart pub get`.
  code_assets: ^2.0.0
  hooks: ^2.2.0
  native_toolchain_c: ^0.19.4
  ffi: ^2.2.0
  # Used by hook/build.dart to verify the SHA-256 of the node.exe it
  # downloads for Windows builds.
  crypto: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/bridge/bridge.js
    - assets/bridge/dist/
    - assets/bridge/dist/data/
    # The Windows node.exe (~105 MB x64 / ~87 MB arm64) is NOT listed here.
    # hook/build.dart downloads it at build time and registers it as a
    # bundled CodeAsset, which Flutter installs next to the app executable.
  plugin:
    platforms:

      ios:
        pluginClass: NcmNodeBridge
      # Desktop (Linux/macOS) is pure Dart — it spawns the system `node`
      # binary via Process. Windows uses the node.exe bundled by the hook.
      # No plugin registration needed; NcmBridgeFactory picks
      # DesktopNcmBridge automatically.
