name: ncm_api_enhanced
description: >
  Unofficial Netease Cloud Music API for Flutter, backed by an embedded
  Node.js v26.9.0 runtime. Exposes all 439 upstream module functions
  as a Dart facade; runs on Linux/macOS/Windows (via the system `node`
  binary), Android (via libnode.so loaded by the native bridge), and
  iOS (via NodeMobile.xcframework embedded in the .app bundle).
version: 0.1.0
homepage: https://github.com/cmachsocket/ncm_api_enhanced
repository: https://github.com/cmachsocket/ncm_api_enhanced

environment:
  sdk: ^3.10.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # Packages used in hook/build.dart. The Dart SDK treats anything
  # imported from hook/ as a runtime dependency, not a dev dependency,
  # even though the hook only runs at build time. These are not
  # shipped in the consumer's app binary — they're only resolved by
  # the host that runs `flutter pub get` / `dart pub get`.
  code_assets: ^2.0.0
  hooks: ^2.2.0
  native_toolchain_c: ^0.19.4
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/bridge/bridge.js
    - assets/bridge/dist/
    - assets/bridge/dist/data/
    # Windows desktop node runtime. We ship a standalone node.exe alongside
    # the bundle so end users don't need to install Node.js themselves.
    # x64 + arm64 — the bridge picks the right one at startup based on
    # `Platform.numberOfProcessors` / arch detection.
    #
    # Cost: ~99 MB (x64) + ~87 MB (arm64) = ~186 MB extra in the Windows
    # release. Acceptable because the alternative is requiring users to
    # install Node 22+ manually on every Windows machine.
    - path: assets/runtime/win-x64/node.exe
      platforms:
        - windows
    - path: assets/runtime/win-arm64/node.exe
      platforms:
        - windows
  plugin:
    platforms:

      ios:
        pluginClass: NcmNodeBridge
      # Desktop (Linux/macOS/Windows) is pure Dart — it spawns the
      # system `node` binary via Process. No plugin registration
      # needed; NcmBridgeFactory picks DesktopNcmBridge automatically.
