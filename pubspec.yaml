name: ncm_api_enhanced
description: >
  Unofficial Netease Cloud Music API for Flutter, backed by an embedded
  nodejs-mobile v18.20.4 runtime. Exposes all 439 upstream module
  functions as a Dart facade; runs on Linux/macOS/Windows (via the
  system `node` binary), Android (via libnode.so loaded by JNI), and
  iOS (via NodeMobile.xcframework embedded in the .app bundle).
version: 0.1.0
publish_to: none
homepage: https://github.com/your-org/ncm_api_enhanced
repository: https://github.com/your-org/ncm_api_enhanced

environment:
  sdk: ^3.10.0
  # Platform-specific assets (the `platforms:` filter under each
  # flutter.assets entry) require Flutter 3.41+. We use it to keep
  # the ~200 MB of Windows node.exe binaries out of the
  # Android / iOS / Linux / macOS release bundles.
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  # Packages used in hook/build.dart. The Dart SDK treats anything
  # imported from hook/ as a runtime dependency, not a dev dependency,
  # even though the hook only runs at build time. These are not
  # shipped in the consumer's app binary — they're only resolved by
  # the host that runs `flutter pub get` / `dart pub get`.
  archive: ^4.0.7
  code_assets: ^2.0.0
  hooks: ^2.2.0
  http: ^1.5.0
  native_toolchain_c: ^0.19.4
  ffi:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  asset_fill: 

flutter:
  assets:
    - assets/bridge/bridge.js
    - path: assets/bridge/dist/bundle.js
      platforms:
        - linux
        - macos
        - windows
    - path: assets/bridge/dist/xhr-sync-worker.js
      platforms:
        - linux
        - macos
        - windows
    - path: assets/bridge/dist/ncm.bundle
      platforms:
        - android
        - ios
      
      
    - assets/bridge/dist/data/
    # Windows desktop node runtime.
    #
    # We ship a standalone node.exe alongside the bundle so end
    # users don't need to install Node themselves. x64 + arm64 —
    # the bridge picks at runtime based on PROCESSOR_ARCHITECTURE.
    # Cost: ~99 MB (x64) + ~87 MB (arm64) = ~186 MB extra in the
    # Windows release. Acceptable because the alternative is
    # requiring Windows users to install Node 22+ manually.
    #
    # The `platforms: [windows]` filter keeps these binaries out of
    # every non-Windows consumer release. Without it the Android
    # APK / iOS IPA / Linux snap / macOS .app all carry the Windows
    # runtime they will never need. The filter requires Flutter
    # 3.41+ (see environment.flutter constraint above); older SDKs
    # silently ignore the filter and bundle everywhere.
    #
    # Note: pub publish still ships the binaries in the plugin
    # tarball regardless of `platforms:` — Flutter only consults
    # this filter at consumer build time, not at package publish.
    # That is intentional here: the file *must* be present on
    # disk so Flutter can locate it at Windows build time.
    - path: assets/runtime/win-x64/node.exe
      platforms:
        - windows
    - path: assets/runtime/win-arm64/node.exe
      platforms:
        - windows
  plugin:
    platforms:

      android:
        package: to.holepunch.ncm_enhanced
        pluginClass: NcmBareBridge
      ios:
        pluginClass: NcmNodeBridge
      # Desktop (Linux/macOS/Windows) is pure Dart — it spawns the
      # system `node` binary via Process. No plugin registration
      # needed; NcmBridgeFactory picks DesktopNcmBridge automatically.
