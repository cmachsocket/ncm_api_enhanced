name: ncm_api_enhanced
description: >-
  Unofficial Netease Cloud Music API as a Flutter package. Embeds a
  Bare runtime on Android and iOS via bare_flutter
  (https://pub.dev/packages/bare_flutter) and exposes the upstream
  `@neteasecloudmusicapienhanced/api` package's 439 module functions
  as a Dart facade.
version: 0.1.0
publish_to: none
homepage: https://github.com/your-org/ncm_api_enhanced
repository: https://github.com/your-org/ncm_api_enhanced

environment:
  sdk: ^3.10.0
  # Platform-specific assets (the `platforms:` filter under each
  # flutter.assets entry) require Flutter 3.41+. We use it to keep
  # the ~200 MB of Windows node.exe binaries out of the
  # Android / iOS / Linux / macOS release bundles.
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  bare_flutter: ^0.1.0
  # Hook dependencies. The Dart SDK treats anything imported from
  # hook/ as a runtime dependency, even though the hook only runs
  # at build time. None of these end up in the consumer's app binary.
  archive: ^4.0.7
  code_assets: ^2.0.0
  hooks: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/bridge/bridge.js
    - path: assets/bridge/dist/bundle.js
      platforms:
        - linux
        - macos
        - windows
    - path: assets/bridge/dist/xhr-sync-worker.js
      platforms:
        - linux
        - macos
        - windows
    - path: assets/bridge/dist/ncm.bundle
      platforms:
        - android
        - ios
    - assets/bridge/dist/data/
    # Windows desktop node runtime.
    #
    # We ship a standalone node.exe alongside the bundle so end
    # users don't need to install Node themselves. x64 + arm64 — the
    # bridge picks at runtime based on PROCESSOR_ARCHITECTURE.
    # Cost: ~99 MB (x64) + ~87 MB (arm64) = ~186 MB extra in the
    # Windows release. Acceptable because the alternative is requiring
    # Windows users to install Node 22+ manually.
    #
    # The `platforms: [windows]` filter keeps these binaries out of
    # every non-Windows consumer release. Without it the Android APK /
    # iOS IPA / Linux snap / macOS .app all carry the Windows runtime
    # they will never need. The filter requires Flutter 3.41+ (see
    # environment.flutter constraint above); older SDKs silently
    # ignore the filter and bundle everywhere.
    #
    # Note: pub publish still ships the binaries in the plugin
    # tarball regardless of `platforms:` — Flutter only consults this
    # filter at consumer build time, not at package publish. That is
    # intentional here: the file *must* be present on disk so Flutter
    # can locate it at Windows build time.
    - path: assets/runtime/win-x64/node.exe
      platforms:
        - windows
    - path: assets/runtime/win-arm64/node.exe
      platforms:
        - windows
  # bare_flutter provides the Android and iOS platform
  # implementations of this package. Both sides declare their own
  # pluginClass (BareFlutterPlugin); we don't redeclare them here.
  # Android/iOS apps get bare-kit worklet hosting for free through
  # bare_flutter; desktop platforms ignore the plugin and spawn the
  # system `node` binary via Process in lib/src/desktop_bridge.dart.
