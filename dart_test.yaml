# Test configuration for `flutter test`.
#
# Tags let CI split the suite:
#
#   * `hook` — the build-hook tests. They download a ~260 MB Node.js runtime
#     and need the Android NDK, so they run in a dedicated CI job instead of
#     on every push.
#
# Run everything except the hook tests with:
#
#   flutter test --exclude-tags=hook
#
# Run only the hook tests with:
#
#   flutter test --tags=hook

tags:
  hook:
    timeout: 20m
