// android/build.gradle
//
// Android plugin module for ncm_api_enhanced.
//
// Responsibilities
// ----------------
//
// This Gradle file is intentionally kept thin.
//
// Native Bare addon build:
//
//   pack.mjs
//       |
//       +-- bare-link
//       |
//       v
//   android/addons/<abi>/*.so
//
// JAR packaging:
//
//   package-addons.mjs
//       |
//       v
//   android/addons-jars/<abi>.jar
//
// Bare runtime:
//
//   bare_flutter
//       |
//       +-- libbare-kit.so
//       +-- Bare Java/Kotlin API
//
// This module only orchestrates the two Node scripts and exposes the
// generated JARs to the Android build.
//
// IMPORTANT:
//
//   libbare-kit.so is NOT one of the addon JARs.
//
//   bare_flutter owns bare-kit itself.
//
//   The JARs generated here contain only:
//
//       lib/<abi>/libbare-*.so
//
// ---------------------------------------------------------------------------

plugins {
    id "com.android.library"
}

group = "to.holepunch"

android {
    namespace = "to.holepunch.ncm_enhanced"
    compileSdk 34

    defaultConfig {
        minSdk 29
        targetSdk 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs += "src/main/java"
        }
    }
}

//
// --------------------------------------------------------------------------
// ABI matrix
// --------------------------------------------------------------------------
//

ext.targetAbis = [
    "arm64-v8a",
    "armeabi-v7a",
    "x86_64",
    "x86"
]

//
// Bare host names corresponding to Android ABIs.
//

ext.hostBin = [
    "arm64-v8a"  : "android-arm64",
    "armeabi-v7a": "android-arm",
    "x86_64"     : "android-x64",
    "x86"        : "android-ia32",
]

//
// --------------------------------------------------------------------------
// Paths
// --------------------------------------------------------------------------
//

ext.bridgeDir = file(
    "${projectDir}/../assets/bridge"
).absolutePath

ext.packScript = file(
    "${bridgeDir}/pack.mjs"
).absolutePath

ext.packageAddonsScript = file(
    "${bridgeDir}/package-addons.mjs"
).absolutePath

ext.addonsDir = file(
    "${projectDir}/addons"
).absolutePath

ext.addonsJarsDir = file(
    "${projectDir}/addons-jars"
).absolutePath

//
// --------------------------------------------------------------------------
// Node executable
// --------------------------------------------------------------------------
//
// Flutter does not ship Node.
//
// Default:
//
//     node
//
// Override:
//
//     NCM_NODE=/absolute/path/to/node
//
// --------------------------------------------------------------------------
//

ext.ncmNodePath = {
    def configured = System.getenv("NCM_NODE")

    if (configured != null && !configured.trim().isEmpty()) {
        return configured.trim()
    }

    return "node"
}

//
// --------------------------------------------------------------------------
// Validate scripts
// --------------------------------------------------------------------------
//

def validateAddonScripts = tasks.register(
    "validateAddonScripts"
) {
    group = "ncm-api-enhanced"

    doLast {
        if (!file(packScript).exists()) {
            throw new GradleException(
                "pack.mjs not found at ${packScript}"
            )
        }

        if (!file(packageAddonsScript).exists()) {
            throw new GradleException(
                "package-addons.mjs not found at ${packageAddonsScript}"
            )
        }
    }
}

//
// --------------------------------------------------------------------------
// Build Bare native addons
// --------------------------------------------------------------------------
//
// pack.mjs is responsible for:
//
//   bridge.js
//       |
//       v
//   bare-pack
//
// and:
//
//   bare-link
//       |
//       v
//   android/addons/<abi>/*.so
//
// One HOST is generated at a time because bare-link selects native
// prebuilds according to the requested Bare host.
//

def buildBareAddons = tasks.register(
    "buildBareAddons"
) {
    group = "ncm-api-enhanced"

    description =
        "Builds Bare native addon .so files for all Android ABIs."

    dependsOn(validateAddonScripts)

    inputs.dir(
        "${projectDir}/../assets/bridge"
    )

    outputs.dir(
        addonsDir
    )

    doLast {
        def nodeExecutable = ncmNodePath()

        println ""
        println "============================================================"
        println " ncm-api-enhanced: building Bare Android addons"
        println " Node   : ${nodeExecutable}"
        println " Bridge : ${bridgeDir}"
        println " Output : ${addonsDir}"
        println "============================================================"
        println ""

        //
        // Remove stale addon output.
        //
        file(addonsDir).deleteDir()
        file(addonsDir).mkdirs()

        targetAbis.each { abi ->

            def host = hostBin[abi]

            if (host == null) {
                throw new GradleException(
                    "No Bare host mapping for ABI ${abi}"
                )
            }

            println ""
            println "------------------------------------------------------------"
            println " ABI  : ${abi}"
            println " HOST : ${host}"
            println "------------------------------------------------------------"

            //
            // Run:
            //
            //     node assets/bridge/pack.mjs
            //
            // with:
            //
            //     HOST=android-arm64
            //
            def pb = new ProcessBuilder(
                nodeExecutable,
                packScript
            )

            //
            // pack.mjs expects to be run from the package's assets
            // directory tree. Running from bridgeDir keeps all relative
            // resolution behaviour identical to manual invocation.
            //
            pb.directory(
                file(bridgeDir)
            )

            pb.environment()["HOST"] = host

            //
            // Make Node's stdout/stderr visible in Gradle output.
            //
            pb.redirectErrorStream(true)

            println ""
            println "Running:"
            println "  ${nodeExecutable} ${packScript}"
            println "  HOST=${host}"
            println ""

            def process

            try {
                process = pb.start()
            } catch (IOException e) {
                throw new GradleException(
                    "Unable to start Node executable '${nodeExecutable}'. " +
                    "Set NCM_NODE to an absolute Node path.",
                    e
                )
            }

            def output = process.inputStream.getText("UTF-8")

            def exitCode = process.waitFor()

            if (!output.trim().isEmpty()) {
                println output
            }

            if (exitCode != 0) {
                throw new GradleException(
                    "pack.mjs failed for ABI ${abi} " +
                    "(HOST=${host}, exit=${exitCode})"
                )
            }

            //
            // pack.mjs writes using the Android ABI directory names.
            //
            def abiDir = file(
                "${addonsDir}/${abi}"
            )

            if (
                !abiDir.exists() ||
                abiDir.listFiles() == null
            ) {
                throw new GradleException(
                    "pack.mjs completed but did not create " +
                    "${abiDir}"
                )
            }

            def soFiles = abiDir.listFiles().findAll {
                it.isFile() && it.name.endsWith(".so")
            }

            if (soFiles.isEmpty()) {
                throw new GradleException(
                    "pack.mjs completed but produced no .so files " +
                    "for ABI ${abi}"
                )
            }

            println(
                "ncm-api-enhanced: ${soFiles.size()} addon(s) built for ${abi}"
            )
        }

        println ""
        println "============================================================"
        println " ncm-api-enhanced: Bare addon native libraries built"
        println " Output: ${addonsDir}"
        println "============================================================"
        println ""
    }
}

//
// --------------------------------------------------------------------------
// Package Bare addons into JARs
// --------------------------------------------------------------------------
//
// package-addons.mjs is the ONLY place that knows how to construct the
// JAR/ZIP structure.
//
// Input:
//
//     android/addons/<abi>/*.so
//
// Output:
//
//     android/addons-jars/<abi>.jar
//
// JAR:
//
//     lib/<abi>/libbare-*.so
//
// --------------------------------------------------------------------------
//

def packageBareAddonJars = tasks.register(
    "packageBareAddonJars"
) {
    group = "ncm-api-enhanced"

    description =
        "Packages Bare native addon .so files into ABI-specific JARs."

    dependsOn(buildBareAddons)

    inputs.dir(
        addonsDir
    )

    outputs.dir(
        addonsJarsDir
    )

    doLast {
        def nodeExecutable = ncmNodePath()

        println ""
        println "============================================================"
        println " ncm-api-enhanced: packaging Bare addon JARs"
        println " Node   : ${nodeExecutable}"
        println " Input  : ${addonsDir}"
        println " Output : ${addonsJarsDir}"
        println "============================================================"
        println ""

        //
        // package-addons.mjs itself handles:
        //
        //   arm64-v8a
        //   armeabi-v7a
        //   x86_64
        //   x86
        //
        // and skips ABIs that do not exist.
        //

        def pb = new ProcessBuilder(
            nodeExecutable,
            packageAddonsScript
        )

        pb.directory(
            file(bridgeDir)
        )

        pb.redirectErrorStream(true)

        println "Running:"
        println "  ${nodeExecutable} ${packageAddonsScript}"
        println ""

        def process

        try {
            process = pb.start()
        } catch (IOException e) {
            throw new GradleException(
                "Unable to start Node executable '${nodeExecutable}'. " +
                "Set NCM_NODE to an absolute Node path.",
                e
            )
        }

        def output = process.inputStream.getText("UTF-8")

        def exitCode = process.waitFor()

        if (!output.trim().isEmpty()) {
            println output
        }

        if (exitCode != 0) {
            throw new GradleException(
                "package-addons.mjs failed (exit=${exitCode})"
            )
        }

        //
        // Verify that at least one JAR was generated.
        //

        def jarFiles = file(addonsJarsDir).exists()
            ? file(addonsJarsDir).listFiles()?.findAll {
                it.isFile() && it.name.endsWith(".jar")
            }
            : []

        if (jarFiles == null || jarFiles.isEmpty()) {
            throw new GradleException(
                "package-addons.mjs completed but produced no JARs " +
                "under ${addonsJarsDir}"
            )
        }

        println ""
        println "ncm-api-enhanced: generated JARs:"

        jarFiles.sort { a, b ->
            a.name <=> b.name
        }.each { jar ->
            println(
                "  ${jar.name} (${jar.length()} bytes)"
            )
        }

        println ""
        println "============================================================"
        println " ncm-api-enhanced: Bare addon JAR packaging complete"
        println " Output: ${addonsJarsDir}"
        println "============================================================"
        println ""
    }
}

//
// --------------------------------------------------------------------------
// Android build integration
// --------------------------------------------------------------------------
//
// The JARs are generated under:
//
//     android/addons-jars/
//
// They are ordinary Gradle dependencies.
//
// IMPORTANT:
//
// Do NOT put them under:
//
//     build/addons/
//
// anymore.
//
// The JARs themselves contain:
//
//     lib/<abi>/*.so
//
// --------------------------------------------------------------------------
//

tasks.named("preBuild") {
    dependsOn(packageBareAddonJars)
}

tasks.named("assemble") {
    dependsOn(packageBareAddonJars)
}

//
// --------------------------------------------------------------------------
// Kotlin
// --------------------------------------------------------------------------
//

kotlin {
    compilerOptions {
        jvmTarget =
            org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

//
// --------------------------------------------------------------------------
// Dependencies
// --------------------------------------------------------------------------
//

dependencies {

    //
    // Generated Bare addon JARs.
    //
    // packageBareAddonJars guarantees that these exist before the
    // dependency is consumed.
    //
    implementation(
        fileTree(
            dir: addonsJarsDir,
            include: "*.jar"
        ).builtBy(packageBareAddonJars)
    )

    //
    // bare_flutter provides Bare Kit itself:
    //
    //   libbare-kit.so
    //   Bare Java API
    //   Worklet / IPC classes
    //
    // This module deliberately does NOT duplicate bare-kit.
    //
}
