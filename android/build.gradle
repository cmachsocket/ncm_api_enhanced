// Plugin-level Android Gradle file. libnode.so is downloaded by the
// Dart-side build hook (hook/build.dart) which declares a CodeAsset for
// each Android ABI. The SDK copies those .so files into the app's
// jniLibs/<abi>/ automatically.
//
// Our local JNI wrapper `libncm_node_bridge.so` (built from
// src/main/cpp/CMakeLists.txt) links against libnode.so via CMake's
// IMPORTED target. cpp/native-lib.cpp is the source for the wrapper.

group 'com.example.ncm_api_enhanced'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = 'com.example.ncm_api_enhanced'
    compileSdk = 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 24
        targetSdk = 35
        // Hook declares CodeAsset for these ABIs; we mirror the same list
        // so the libncm_node_bridge.so is built once per matching ABI.
        externalNativeBuild {
            cmake {
                cppFlags += ['-std=c++17']
                arguments += ['-DANDROID_STL=c++_shared']
            }
        }
        ndk {
            abiFilters += ['armeabi-v7a', 'arm64-v8a', 'x86_64']
        }
    }

    externalNativeBuild {
        cmake {
            path = file('src/main/cpp/CMakeLists.txt')
            version = '3.22.1'
        }
    }

    packagingOptions {
        // libnode.so must NOT be page-aligned/compressed; AGP defaults to
        // compressing which silently breaks JNI loading. jniLibs {
        //   useLegacyPackaging = false } is the AGP 8+ syntax.
        jniLibs {
            useLegacyPackaging = false
        }
    }

    sourceSets {
        main {
            // libnode.so files placed here by the Dart build hook are
            // picked up as part of the AAR's jniLibs.
            jniLibs.srcDirs += ['jniLibs']
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}