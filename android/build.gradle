// android/build.gradle
//
// Android plugin module for ncm_api_enhanced.
//
// This module is registered as a Flutter plugin via
// `flutter.plugin.platforms.android.package` + `pluginClass` in the
// package's pubspec.yaml. The Flutter build toolchain merges the
// resulting .jar / .aar into the host app automatically — no
// host-side wiring required.
//
// Two pieces have to land on the host app's classpath for the
// plugin to work:
//
//   1. to.holepunch.bare.kit.*  — the Java API for bare-kit, packaged
//      as a single classes.jar in the upstream prebuild. The
//      build hook (hook/build.dart) downloads the prebuild, extracts
//      that jar into android/libs/, and this module declares it as a
//      file dependency. Android Gradle Plugin's transitive classpath
//      resolution puts it on the host app's runtime classpath at
//      build time.
//
//   2. libbare-kit.so  — the native bare runtime plus all
//      bundled bare-* addons. Registered as a Flutter code asset by
//      hook/build.dart, which puts the .so in lib/<abi>/libbare-kit.so
//      inside the host APK. Worklet.start() loads it via
//      System.loadLibrary("bare-kit").

plugins {
  id "com.android.library"
}

group = "to.holepunch"

android {
  namespace = "to.holepunch.ncm_enhanced"
  compileSdk 34

  defaultConfig {
    minSdk 29
    targetSdk 34
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  sourceSets {
    main {
      java.srcDirs += "src/main/kotlin"
    }
  }
}

dependencies {
  // The bare-kit Java API (to.holepunch.bare.kit.Worklet + IPC).
  //
  // hook/build.dart extracts this jar into android/libs/ during the
  // build hook phase. It is shipped in the upstream prebuilds.zip at
  // `prebuilds/android/bare-kit/classes.jar`.
  implementation files("libs/bare-kit-classes.jar")

  // Flutter embedding — required so we can implement FlutterPlugin
  // and register MethodChannel / EventChannel handlers.
  implementation "io.flutter:flutter_embedding:1.0.0"
}
