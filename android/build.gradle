// android/build.gradle
//
// Android plugin module for ncm_api_enhanced.
//
// Responsibilities
// ----------------
//
// This module ONLY consumes pre-generated Bare addon artifacts.
//
// Pre-build preparation:
//
//   pack.mjs
//       |
//       +-- bare-pack
//       +-- bare-link
//       |
//       v
//   android/addons/<abi>/*.so
//       |
//       v
//   package-addons.mjs
//       |
//       v
//   android/addons-jars/<abi>.jar
//
// Android build:
//
//   android/addons-jars/arm64-v8a.jar
//       |
//       v
//   Gradle extracts JNI libraries
//       |
//       v
//   AAR / APK
//
// Bare runtime:
//
//   bare_flutter
//       |
//       +-- libbare-kit.so
//       +-- Bare Java/Kotlin API
//       +-- Worklet runtime
//
// IMPORTANT:
//
//   This Gradle file does NOT:
//     - run Node
//     - run pack.mjs
//     - run bare-pack
//     - run bare-link
//     - run package-addons.mjs
//     - generate .so files
//     - generate JARs
//     - download Bare addons
//     - provide libbare-kit.so
//
// The addon JAR must already exist when this Android plugin is built.
//
// Supported Android ABI:
//
//   arm64-v8a
//
// "ARMv8" here means Android's arm64-v8a ABI.
//
// libbare-kit.so is owned entirely by bare_flutter.
//

plugins {
    id "com.android.library"
}

group = "to.holepunch"

android {
    namespace = "to.holepunch.ncm_enhanced"
    compileSdk 34

    defaultConfig {
        minSdk 31
        targetSdk 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs += "src/main/java"

            //
            // Native Bare addons extracted from the pre-generated JAR.
            //
            jniLibs.srcDir(
                "${buildDir}/generated/jniLibs"
            )
        }
    }
}

//
// --------------------------------------------------------------------------
// Pre-generated Bare addon JAR
// --------------------------------------------------------------------------
//
// This file is a package artifact.
//
// It MUST already exist before Gradle starts the Android build.
//
// Gradle only extracts the native libraries from it.
// It does NOT generate or link the addons.
//
// --------------------------------------------------------------------------
//

def addonsJarsDir = file(
    "${projectDir}/addons-jars"
)

def addonJar = file(
    "${addonsJarsDir}/arm64-v8a.jar"
)

//
// Extracted JNI directory:
//
//   build/generated/jniLibs/
//       arm64-v8a/
//           libbare-*.so
//
// --------------------------------------------------------------------------
//

def extractedJniLibsDir = file(
    "${buildDir}/generated/jniLibs"
)

//
// --------------------------------------------------------------------------
// Validate pre-generated artifact
// --------------------------------------------------------------------------
//

def validateAddonJar = tasks.register(
    "validateAddonJar"
) {
    group = "ncm-api-enhanced"

    description =
        "Validates the pre-generated Bare Android ARM64 addon JAR."

    doLast {

        if (!addonsJarsDir.exists()) {
            throw new RuntimeException(
                "ncm_api_enhanced: addon JAR directory does not exist:\n" +
                "  ${addonsJarsDir.absolutePath}\n\n" +
                "Expected:\n" +
                "  android/addons-jars/arm64-v8a.jar"
            )
        }

        if (!addonJar.exists()) {
            throw new RuntimeException(
                "ncm_api_enhanced: missing pre-generated Android addon JAR:\n" +
                "  ${addonJar.absolutePath}\n\n" +
                "Generate it before the Flutter/Gradle build."
            )
        }

        if (addonJar.length() == 0) {
            throw new RuntimeException(
                "ncm_api_enhanced: addon JAR is empty:\n" +
                "  ${addonJar.absolutePath}"
            )
        }

        println ""
        println "============================================================"
        println " ncm-api-enhanced: pre-generated Bare addon"
        println "============================================================"
        println "  ABI : arm64-v8a"
        println "  JAR : ${addonJar.absolutePath}"
        println "  Size: ${addonJar.length()} bytes"
        println "============================================================"
        println ""
    }
}

//
// --------------------------------------------------------------------------
// Extract JNI libraries from the pre-generated JAR
// --------------------------------------------------------------------------
//
// The JAR is a ZIP archive:
//
//   lib/arm64-v8a/libbare-foo.so
//   lib/arm64-v8a/libbare-bar.so
//
// Android's jniLibs source set expects:
//
//   <jniLibsDir>/arm64-v8a/libbare-foo.so
//
// Therefore we extract ONLY the native libraries.
//
// This is NOT addon generation.
// It is simply Gradle's consumption of the already-generated artifact.
//
// --------------------------------------------------------------------------
//

def extractAddonJniLibs = tasks.register(
    "extractAddonJniLibs",
    Sync
) {
    group = "ncm-api-enhanced"

    description =
        "Extracts pre-generated Bare ARM64 addon JNI libraries."

    dependsOn(validateAddonJar)

    from {
        zipTree(addonJar)
    }

    include(
        "lib/arm64-v8a/*.so"
    )

    //
    // Remove the leading "lib/" directory.
    //
    eachFile {
        path = path.substring(
            "lib/".length()
        )
    }

    includeEmptyDirs = false

    into(extractedJniLibsDir)
}

//
// --------------------------------------------------------------------------
// Dependencies
// --------------------------------------------------------------------------
//
// Do NOT use:
//
//   implementation(fileTree(...))
//
// because that treats the JAR as a normal Java dependency and does not
// establish the JAR's embedded .so files as Android JNI libraries.
//
// The native .so files are consumed through sourceSets.main.jniLibs.
//
// --------------------------------------------------------------------------
//

dependencies {
    //
    // Deliberately no addon JAR implementation dependency.
    //
    // The JAR is an input artifact for extractAddonJniLibs.
    //
}

//
// --------------------------------------------------------------------------
// Build ordering
// --------------------------------------------------------------------------
//
// Validation -> extraction -> Android native packaging.
//
// No Node.
// No bare-pack.
// No bare-link.
// No addon generation.
//
// --------------------------------------------------------------------------
//

tasks.named("preBuild") {
    dependsOn(extractAddonJniLibs)
}

tasks.named("assemble") {
    dependsOn(extractAddonJniLibs)
}

//
// --------------------------------------------------------------------------
// Kotlin
// --------------------------------------------------------------------------
//

kotlin {
    compilerOptions {
        jvmTarget =
            org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}