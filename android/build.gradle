// android/build.gradle
//
// Android plugin module for ncm_api_enhanced.
//
// Responsibilities
// ----------------
//
// This module ONLY consumes pre-generated Bare addon JARs.
//
// Pre-build preparation:
//
//   pack.mjs
//       |
//       +-- bare-pack
//       +-- bare-link
//       |
//       v
//   android/addons/<abi>/*.so
//       |
//       v
//   package-addons.mjs
//       |
//       v
//   android/addons-jars/<abi>.jar
//
// Android build:
//
//   android/addons-jars/*.jar
//       |
//       v
//   Gradle dependency
//       |
//       v
//   AAR / APK
//
// Bare runtime:
//
//   bare_flutter
//       |
//       +-- libbare-kit.so
//       +-- Bare Java/Kotlin API
//       +-- Worklet runtime
//
// IMPORTANT:
//
//   This Gradle file does NOT:
//     - run Node
//     - run pack.mjs
//     - run bare-pack
//     - run bare-link
//     - run package-addons.mjs
//     - generate .so files
//     - generate JARs
//     - download Bare addons
//     - provide libbare-kit.so
//
// The addon JARs must already exist when this Android plugin is built.
//
// Expected files:
//
//   android/addons-jars/
//       arm64-v8a.jar
//       armeabi-v7a.jar
//       x86_64.jar
//       x86.jar
//
// Each JAR contains:
//
//   lib/<abi>/libbare-*.so
//
// libbare-kit.so is owned entirely by bare_flutter.
//

plugins {
    id "com.android.library"
}

group = "to.holepunch"

android {
    namespace = "to.holepunch.ncm_enhanced"
    compileSdk 34

    defaultConfig {
        minSdk 29
        targetSdk 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs += "src/main/java"
        }
    }
}

//
// --------------------------------------------------------------------------
// Pre-generated Bare addon JARs
// --------------------------------------------------------------------------
//
// These files are part of the package and MUST already exist.
//
// Do not generate them from Gradle.
//
// --------------------------------------------------------------------------
//

def addonsJarsDir = file(
    "${projectDir}/addons-jars"
)

def addonJarNames = [
    "arm64-v8a.jar",
    "armeabi-v7a.jar",
    "x86_64.jar",
    "x86.jar",
]

//
// --------------------------------------------------------------------------
// Validate pre-generated artifacts
// --------------------------------------------------------------------------
//

def validateAddonJars = tasks.register(
    "validateAddonJars"
) {
    group = "ncm-api-enhanced"

    description =
        "Validates pre-generated Bare Android addon JARs."

    doLast {

        if (!addonsJarsDir.exists()) {
            throw new RuntimeException(
                "ncm_api_enhanced: addon JAR directory does not exist:\n" +
                "  ${addonsJarsDir.absolutePath}\n\n" +
                "Expected pre-generated Android addon JARs."
            )
        }

        def missing = []

        addonJarNames.each { name ->
            def jar = file(
                "${addonsJarsDir}/${name}"
            )

            if (!jar.exists()) {
                missing << name
            } else if (jar.length() == 0) {
                throw new RuntimeException(
                    "ncm_api_enhanced: addon JAR is empty:\n" +
                    "  ${jar.absolutePath}"
                )
            }
        }

        if (!missing.isEmpty()) {
            throw new RuntimeException(
                "ncm_api_enhanced: missing pre-generated Android " +
                "addon JAR(s):\n" +
                missing.collect {
                    "  android/addons-jars/${it}"
                }.join("\n") +
                "\n\nThese files must be generated before the Flutter/Gradle build."
            )
        }

        println ""
        println "============================================================"
        println " ncm-api-enhanced: pre-generated Bare addon JARs"
        println "============================================================"

        addonJarNames.each { name ->
            def jar = file(
                "${addonsJarsDir}/${name}"
            )

            println(
                "  ${name} (${jar.length()} bytes)"
            )
        }

        println "============================================================"
        println ""
    }
}

//
// --------------------------------------------------------------------------
// Dependencies
// --------------------------------------------------------------------------
//
// The addon JARs are ordinary Gradle dependencies.
//
// There is deliberately NO .builtBy() relationship.
//
// Why:
//
// These files are pre-generated package artifacts, not Gradle outputs.
//
// --------------------------------------------------------------------------
//

dependencies {

    implementation(
        fileTree(
            dir: addonsJarsDir,
            include: "*.jar"
        )
    )
}

//
// --------------------------------------------------------------------------
// Make validation happen before Android compilation.
//
// No generation occurs here.
//
// --------------------------------------------------------------------------
//

tasks.named("preBuild") {
    dependsOn(validateAddonJars)
}

tasks.named("assemble") {
    dependsOn(validateAddonJars)
}

//
// --------------------------------------------------------------------------
// Kotlin
// --------------------------------------------------------------------------
//

kotlin {
    compilerOptions {
        jvmTarget =
            org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
